# Bean Validation messages in Bahasa Indonesia (requests with Accept-Language: id).
# Standard constraints used in the code
jakarta.validation.constraints.NotBlank.message=tidak boleh kosong
jakarta.validation.constraints.NotNull.message=wajib diisi
jakarta.validation.constraints.Size.message=panjang harus antara {min} dan {max}
jakarta.validation.constraints.Email.message=harus berupa alamat email yang valid
jakarta.validation.constraints.Past.message=harus berupa tanggal sebelum hari ini
jakarta.validation.constraints.PastOrPresent.message=harus berupa tanggal hari ini atau sebelumnya
jakarta.validation.constraints.FutureOrPresent.message=harus berupa tanggal hari ini atau sesudahnya
jakarta.validation.constraints.Min.message=tidak boleh kurang dari {value}
jakarta.validation.constraints.Max.message=tidak boleh lebih dari {value}

