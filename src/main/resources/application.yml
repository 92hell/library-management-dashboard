server:
  port: ${PORT:8080}
  # Behind a hosting proxy (Render, Railway...): Tomcat takes the visitor's address and https from
  # X-Forwarded-For / X-Forwarded-Proto, but only when the connection comes from a private/internal
  # address (the proxy). Clients on the internet cannot spoof it. If your proxy connects from a
  # public address, set SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES to a regex matching it.
  forward-headers-strategy: native
  # gzip text responses (HTML, JS, CSS, JSON) - hosting plans meter outbound bandwidth.
  compression:
    enabled: true
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # HTTPS-only cookie. Browsers still accept it on http://localhost; set
        # SESSION_COOKIE_SECURE=false only for plain-HTTP testing on another host.
        secure: ${SESSION_COOKIE_SECURE:true}
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: library-dashboard
  mail:
    # SMTP server for email notifications. Set SPRING_MAIL_HOST (plus SPRING_MAIL_PORT,
    # SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD) to turn it on; no host = no mail sender.
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/library_sandbox}
    username: ${DB_USERNAME:library}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration).
      ddl-auto: none
    properties:
      hibernate:
        # Store Instant audit columns as plain TIMESTAMP (matches the Flyway schema).
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    # Lets the app adopt a database created by an older version (Hibernate ddl-auto):
    # an existing schema is marked as V1 and only later migrations are applied.
    baseline-on-migrate: true

library:
  security:
    # CDN/edge servers in front of the hosting proxy (Render uses Cloudflare). When a request was
    # relayed by one of these, the visitor's address is read from the header that edge set
    # (CF-Connecting-IP), see ClientAddresses. Comma-separated CIDRs; empty = none. Defaults to
    # Cloudflare's published ranges (https://www.cloudflare.com/ips/).
    # edge-proxy-ranges: ${EDGE_PROXY_RANGES}
    # First librarian, created on startup if missing. Empty password = generated and printed to the log.
    librarian:
      username: ${LIBRARIAN_USERNAME:librarian}
      password: ${LIBRARIAN_PASSWORD:}
  loans:
    period-days: ${LOAN_PERIOD_DAYS:14}
    max-open-per-member: ${LOAN_MAX_OPEN_PER_MEMBER:3}
    due-soon-days: ${LOAN_DUE_SOON_DAYS:2}
    # Days a copy set aside for a member waits on the holds shelf before the hold expires.
    pickup-days: ${LOAN_PICKUP_DAYS:3}
    # Renewals per loan (each adds period-days); refused if someone is waiting or it is overdue.
    max-renewals: ${LOAN_MAX_RENEWALS:1}
    # Daily reminder run (second minute hour day month weekday); "-" disables it.
    reminder-cron: ${LOAN_REMINDER_CRON:0 0 8 * * *}
  fines:
    # Late fee per day a book is returned late, the most one loan can cost, and the unpaid total
    # at which a member cannot borrow until they pay (0 = never). Whole units of the currency.
    per-day: ${FINE_PER_DAY:1000}
    max-per-loan: ${FINE_MAX_PER_LOAN:30000}
    block-at: ${FINE_BLOCK_AT:20000}
    currency: ${FINE_CURRENCY:IDR}
  notifications:
    # Public address of the app; links in emails/messages are built from it.
    base-url: ${APP_BASE_URL:http://localhost:8080}
    # In-app notifications are always on. External channels are off until configured:
    email:
      # Also needs an SMTP server: SPRING_MAIL_HOST etc. (see spring.mail above).
      enabled: ${NOTIFY_EMAIL_ENABLED:false}
      sender: ${NOTIFY_EMAIL_FROM:Library <no-reply@library.local>}
    sms:
      # Dry run (logged) until a provider integration is written; see PhoneMessagingChannel.
      enabled: ${NOTIFY_SMS_ENABLED:false}
      provider: ${NOTIFY_SMS_PROVIDER:twilio}
      sender: ${NOTIFY_SMS_SENDER:}
      api-url: ${NOTIFY_SMS_API_URL:}
      api-key: ${NOTIFY_SMS_API_KEY:}
    whatsapp:
      enabled: ${NOTIFY_WHATSAPP_ENABLED:false}
      provider: ${NOTIFY_WHATSAPP_PROVIDER:meta-cloud-api}
      sender: ${NOTIFY_WHATSAPP_SENDER:}
      api-url: ${NOTIFY_WHATSAPP_API_URL:}
      api-key: ${NOTIFY_WHATSAPP_API_KEY:}
  demo:
    # Public demo: sample data, demo logins on the login page, registration off, restricted demo
    # accounts, and a full reset at start-up and nightly. Never use it with real users.
    enabled: ${DEMO_MODE:false}
    password: ${DEMO_PASSWORD:demo-password}
    reset-cron: ${DEMO_RESET_CRON:0 0 3 * * *}

logging:
  file:
    # Folder for library.log, error.log and audit.log (see logback-spring.xml).
    path: ${LOG_PATH:logs}

management:
  endpoints:
    web:
      exposure:
        include: health
