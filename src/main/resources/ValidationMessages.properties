# Custom Bean Validation messages (English). The standard jakarta.validation.constraints.* keys are
# not redefined here, so English keeps Hibernate Validator's defaults; Indonesian is in _id.
library.validation.username=must be 3-50 letters, digits, dots, dashes or underscores
library.validation.phone=must be a phone number: digits, spaces or dashes, optionally starting with +
library.validation.barcode=must be 4-32 letters, digits or dashes
library.validation.bookOrCopy=choose a book or scan a copy's barcode
library.validation.notBeforeBorrowDate=must not be before the borrow date
