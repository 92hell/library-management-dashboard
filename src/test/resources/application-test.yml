# Tests whose app setup differs (e.g. demo mode wipes data) use their own database, named
# prefix + name + suffix. `mvn -Pmariadb verify` switches both URLs to MariaDB containers.
test:
  isolated-db:
    prefix: "jdbc:h2:mem:"
    suffix: ";MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1"

spring:
  datasource:
    url: jdbc:h2:mem:library;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      # Fails the build if entities and Flyway migrations drift apart.
      ddl-auto: validate

library:
  security:
    librarian:
      username: librarian
      password: librarian-test-pw
  loans:
    reminder-cron: "-"
  members:
    reminder-cron: "-"
  demo:
    enabled: false
    reset-cron: "-"
