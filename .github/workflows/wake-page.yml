name: Wake-up page

# A static page on GitHub Pages (which never sleeps) that wakes the free Render demo and opens it
# once it answers. One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - wake/**
      - frontend/public/favicon.svg
      - frontend/public/og-image.png
      - .github/workflows/wake-page.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: node --test wake/*.test.mjs
      - name: Assemble the page
        run: |
          mkdir _site
          cp wake/index.html wake/wake.js frontend/public/favicon.svg frontend/public/og-image.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
